services:
  os-cve-cache:
    build: .
    image: os-cve-cache:latest
    container_name: os-cve-cache
    ports:
      - "8080:8080"
    environment:
      ADDR: ":8080"
      CONFIG_PATH: "/app/config.yaml"
      # NVD_API_KEY: ""   # optional
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
